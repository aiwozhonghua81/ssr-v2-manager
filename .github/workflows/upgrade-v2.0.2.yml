name: Apply SSR V2.0.2 city-name upgrade

on:
  push:
    paths:
      - '.github/workflows/upgrade-v2.0.2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch manager and README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ssr-v2-manager.sh')
          s = p.read_text()
          s = s.replace('SCRIPT_VERSION="2.0.1"', 'SCRIPT_VERSION="2.0.2"', 1)

          old = '''public_ip() {
              local ip=""
              ip="$(curl -4fsS --max-time 4 https://api.ipify.org 2>/dev/null || true)"
              [[ -n "${ip}" ]] || ip="$(curl -4fsS --max-time 4 https://ifconfig.me/ip 2>/dev/null || true)"
              [[ -n "${ip}" ]] || ip="$(curl -4fsS --max-time 4 https://icanhazip.com 2>/dev/null | tr -d '\\r\\n' || true)"
              [[ -n "${ip}" ]] || ip="<服务器公网IP>"
              printf "%s" "${ip}"
          }
          '''

          new = '''public_ip() {
              local ip=""
              ip="$(curl -4fsS --max-time 4 https://api.ipify.org 2>/dev/null || true)"
              [[ -n "${ip}" ]] || ip="$(curl -4fsS --max-time 4 https://ifconfig.me/ip 2>/dev/null || true)"
              [[ -n "${ip}" ]] || ip="$(curl -4fsS --max-time 4 https://icanhazip.com 2>/dev/null | tr -d '\\r\\n' || true)"
              [[ -n "${ip}" ]] || ip="<服务器公网IP>"
              printf "%s" "${ip}"
          }

          normalize_city_name() {
              local city="${1:-}" lower=""
              city="$(printf '%s' "${city}" | tr -d '\\r\\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [[ -n "${city}" && "${city}" != "null" ]] || { printf ""; return; }

              # 只保留城市名，不展示省份或行政区后缀。
              city="${city%特别行政区}"
              city="${city%自治州}"
              city="${city%地区}"
              city="${city%市}"

              lower="$(printf '%s' "${city}" | tr '[:upper:]' '[:lower:]')"
              case "${lower}" in
                  beijing|"beijing city") city="北京" ;;
                  shanghai|"shanghai city") city="上海" ;;
                  hangzhou) city="杭州" ;;
                  shenzhen) city="深圳" ;;
                  guangzhou) city="广州" ;;
                  qingdao) city="青岛" ;;
                  chengdu) city="成都" ;;
                  wuhan) city="武汉" ;;
                  nanjing) city="南京" ;;
                  fuzhou) city="福州" ;;
                  heyuan) city="河源" ;;
                  zhangjiakou) city="张家口" ;;
                  hohhot|huhehaote) city="呼和浩特" ;;
                  ulanqab|ulanchabu|wulanchabu) city="乌兰察布" ;;
                  tianjin|"tianjin city") city="天津" ;;
                  chongqing|"chongqing city") city="重庆" ;;
                  xiamen) city="厦门" ;;
                  suzhou) city="苏州" ;;
                  ningbo) city="宁波" ;;
                  hefei) city="合肥" ;;
                  jinan) city="济南" ;;
                  zhengzhou) city="郑州" ;;
                  changsha) city="长沙" ;;
                  nanchang) city="南昌" ;;
                  xian|"xi'an") city="西安" ;;
                  kunming) city="昆明" ;;
                  guiyang) city="贵阳" ;;
                  nanning) city="南宁" ;;
                  haikou) city="海口" ;;
                  shenyang) city="沈阳" ;;
                  dalian) city="大连" ;;
                  changchun) city="长春" ;;
                  harbin) city="哈尔滨" ;;
                  taiyuan) city="太原" ;;
                  shijiazhuang) city="石家庄" ;;
                  lanzhou) city="兰州" ;;
                  yinchuan) city="银川" ;;
                  xining) city="西宁" ;;
                  urumqi|urumchi) city="乌鲁木齐" ;;
                  lhasa) city="拉萨" ;;
                  "hong kong") city="香港" ;;
                  macao|macau) city="澳门" ;;
                  taipei) city="台北" ;;
                  kaohsiung) city="高雄" ;;
                  singapore) city="新加坡" ;;
                  tokyo) city="东京" ;;
                  osaka) city="大阪" ;;
                  seoul) city="首尔" ;;
                  bangkok) city="曼谷" ;;
                  "kuala lumpur") city="吉隆坡" ;;
                  "los angeles") city="洛杉矶" ;;
                  "san jose") city="圣何塞" ;;
                  "san francisco") city="旧金山" ;;
                  seattle) city="西雅图" ;;
                  "new york"|"new york city") city="纽约" ;;
                  london) city="伦敦" ;;
                  frankfurt|"frankfurt am main") city="法兰克福" ;;
                  paris) city="巴黎" ;;
                  amsterdam) city="阿姆斯特丹" ;;
                  sydney) city="悉尼" ;;
              esac
              printf "%s" "${city}"
          }

          server_city() {
              local ip="${1:-}" json="" city="" pro=""
              [[ -n "${ip}" && "${ip}" != "<服务器公网IP>" ]] || { printf "节点"; return; }

              # 首选中文 IP 库，只读取 city；直辖市 city 为空时才回退到同级 pro。
              json="$(curl -4fsSL --max-time 5 -A 'Mozilla/5.0' \
                  "https://whois.pconline.com.cn/ipJson.jsp?ip=${ip}&json=true" 2>/dev/null || true)"
              if [[ -n "${json}" ]]; then
                  city="$(printf '%s' "${json}" | jq -r '.city // empty' 2>/dev/null || true)"
                  pro="$(printf '%s' "${json}" | jq -r '.pro // empty' 2>/dev/null || true)"
                  if [[ -z "${city}" && ( "${pro}" == *市 || "${pro}" == *特别行政区 ) ]]; then
                      city="${pro}"
                  fi
              fi

              # HTTPS 国际 IP 库兜底。
              if [[ -z "${city}" ]]; then
                  json="$(curl -4fsSL --max-time 5 "https://ipwho.is/${ip}" 2>/dev/null || true)"
                  [[ -n "${json}" ]] && city="$(printf '%s' "${json}" | jq -r 'select(.success != false) | .city // empty' 2>/dev/null || true)"
              fi
              if [[ -z "${city}" ]]; then
                  city="$(curl -4fsSL --max-time 5 "https://ipapi.co/${ip}/city/" 2>/dev/null | tr -d '\\r\\n' || true)"
              fi

              city="$(normalize_city_name "${city}")"
              [[ -n "${city}" ]] || city="节点"
              printf "%s" "${city}"
          }
          '''

          if old not in s:
              raise SystemExit('public_ip block not found; aborting')
          s = s.replace(old, new, 1)

          old = '''    local ip port password method protocol obfs udp state
              ip="$(public_ip)"
              port="$(current_port)"
          '''
          new = '''    local ip city node_name port password method protocol obfs udp state
              ip="$(public_ip)"
              city="$(server_city "${ip}")"
              port="$(current_port)"
              node_name="${city}-${ip}-${port}"
          '''
          if old not in s:
              raise SystemExit('show_info local block not found')
          s = s.replace(old, new, 1)

          old = '''状态       : ${state}
          服务器     : ${ip}
          端口       : ${port}
          '''
          new = '''状态       : ${state}
          节点名称   : ${node_name}
          城市       : ${city}
          服务器     : ${ip}
          端口       : ${port}
          '''
          if old not in s:
              raise SystemExit('show_info output block not found')
          s = s.replace(old, new, 1)

          old = '''    local host port password method protocol obfs pparam oparam remarks pass64 raw query
              host="$(public_ip)"
          '''
          new = '''    local host city port password method protocol obfs pparam oparam remarks pass64 raw query
              host="$(public_ip)"
          '''
          if old not in s:
              raise SystemExit('generate_ssr_link local block not found')
          s = s.replace(old, new, 1)

          old = '''    pparam="$(cfg_get '.protocol_param')"
              oparam="$(cfg_get '.obfs_param')"
              remarks="SSR-${host}-${port}"
          '''
          new = '''    pparam="$(cfg_get '.protocol_param')"
              oparam="$(cfg_get '.obfs_param')"
              city="$(server_city "${host}")"
              remarks="${city}-${host}-${port}"
              info "节点名称：${remarks}"
          '''
          if old not in s:
              raise SystemExit('SSR remarks block not found')
          s = s.replace(old, new, 1)

          old = '''show_public_ip() {
              echo "公网 IPv4：$(public_ip)"
              echo "本机地址："
              ip -br addr show 2>/dev/null || true
          }
          '''
          new = '''show_public_ip() {
              local ip city
              ip="$(public_ip)"
              city="$(server_city "${ip}")"
              echo "公网 IPv4：${ip}"
              echo "所在城市：${city}"
              echo "本机地址："
              ip -br addr show 2>/dev/null || true
          }
          '''
          if old not in s:
              raise SystemExit('show_public_ip block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          r = Path('README.md')
          text = r.read_text()
          text = text.replace('SSR V2 Manager 2.0.1', 'SSR V2 Manager 2.0.2')
          marker = '- 生成 `ssr://` 链接\n- 终端输出二维码\n'
          addition = '- 自动识别服务器公网 IP 所在城市，并生成 `中文城市-IP-端口` 节点名称（不显示省份）\n'
          if addition not in text and marker in text:
              text = text.replace(marker, marker + addition, 1)
          r.write_text(text)
          PY

          bash -n ssr-v2-manager.sh

      - name: Commit upgrade
        shell: bash
        run: |
          rm -f .github/workflows/upgrade-v2.0.2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ssr-v2-manager.sh README.md .github/workflows/upgrade-v2.0.2.yml
          git commit -m 'feat: auto-name SSR nodes by city (v2.0.2)'
          git push origin HEAD:main
