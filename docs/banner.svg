    <text x="60" y="186" font-size="23" fill="#9fb3c8">ShadowsocksR 服务端一键安装与管理脚本：Ubuntu/Debian 单文件 Bash，自带守护进程、</text><text x="60" y="222" font-size="23" fill="#9fb3c8">流量统计、防火墙规则和防火墙端口自动放行</text>
